name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # VITE_BASE defaults to './' (relative) in vite.config.ts, so the same
      # build works on project pages, user pages and custom domains.
      # Set VITE_BASE=/<repo>/ here if you prefer absolute asset URLs.
      # Set VITE_API_BASE to point at a self-hosted luogu-saver API.
      - run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
